<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task Management - Project Tracker</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Task CSS -->
    <link rel="stylesheet" href="tasks.css">
</head>

<body>

<!-- =============================== -->
<!-- NAVBAR -->
<!-- =============================== -->

<nav class="navbar navbar-dark bg-primary shadow-sm">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           href="index.html">

            <i class="bi bi-kanban"></i>
            Project Tracker

        </a>

        <div class="d-flex align-items-center gap-2">

            <a href="index.html"
               class="btn btn-light btn-sm">

                <i class="bi bi-speedometer2"></i>
                Dashboard

            </a>

            <button
                class="btn btn-outline-light btn-sm"
                onclick="logout()">

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </button>

        </div>

    </div>

</nav>


<!-- =============================== -->
<!-- MAIN CONTENT -->
<!-- =============================== -->

<div class="container-fluid px-4 py-4">

    <!-- HEADER -->

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                <i class="bi bi-check2-square"></i>
                Task Management
            </h2>

            <p class="text-muted mb-0">
                Create, manage and track your project tasks.
            </p>

        </div>

        <button
            class="btn btn-primary"
            onclick="openAddTaskModal()">

            <i class="bi bi-plus-lg"></i>
            Add Task

        </button>

    </div>


    <!-- =============================== -->
    <!-- STATISTICS -->
    <!-- =============================== -->

    <div class="row g-3 mb-4">

        <!-- TOTAL -->

        <div class="col-md-6 col-lg-3">

            <div class="card stat-card shadow-sm">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-center">

                        <div>

                            <p class="text-muted mb-1">
                                Total Tasks
                            </p>

                            <h3 id="totalTasks"
                                class="fw-bold mb-0">
                                0
                            </h3>

                        </div>

                        <div class="stat-icon">
                            <i class="bi bi-list-task"></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- TODO -->

        <div class="col-md-6 col-lg-3">

            <div class="card stat-card shadow-sm">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-center">

                        <div>

                            <p class="text-muted mb-1">
                                To Do
                            </p>

                            <h3 id="todoTasks"
                                class="fw-bold mb-0">
                                0
                            </h3>

                        </div>

                        <div class="stat-icon">
                            <i class="bi bi-circle"></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- IN PROGRESS -->

        <div class="col-md-6 col-lg-3">

            <div class="card stat-card shadow-sm">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-center">

                        <div>

                            <p class="text-muted mb-1">
                                In Progress
                            </p>

                            <h3 id="inProgressTasks"
                                class="fw-bold mb-0">
                                0
                            </h3>

                        </div>

                        <div class="stat-icon">
                            <i class="bi bi-hourglass-split"></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- COMPLETED -->

        <div class="col-md-6 col-lg-3">

            <div class="card stat-card shadow-sm">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-center">

                        <div>

                            <p class="text-muted mb-1">
                                Completed
                            </p>

                            <h3 id="completedTasks"
                                class="fw-bold mb-0">
                                0
                            </h3>

                        </div>

                        <div class="stat-icon">
                            <i class="bi bi-check-circle"></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =============================== -->
    <!-- FILTERS -->
    <!-- =============================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <!-- SEARCH -->

                <div class="col-md-6 col-lg-3">

                    <label class="form-label fw-semibold">
                        Search
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="searchTask"
                            class="form-control"
                            placeholder="Search tasks...">

                    </div>

                </div>


                <!-- PROJECT -->

                <div class="col-md-6 col-lg-3">

                    <label class="form-label fw-semibold">
                        Project
                    </label>

                    <select
                        id="filterProject"
                        class="form-select">

                        <option value="">
                            All Projects
                        </option>

                    </select>

                </div>


                <!-- STATUS -->

                <div class="col-md-6 col-lg-2">

                    <label class="form-label fw-semibold">
                        Status
                    </label>

                    <select
                        id="filterStatus"
                        class="form-select">

                        <option value="">
                            All Status
                        </option>

                        <option value="Todo">
                            To Do
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>


                <!-- PRIORITY -->

                <div class="col-md-6 col-lg-2">

                    <label class="form-label fw-semibold">
                        Priority
                    </label>

                    <select
                        id="filterPriority"
                        class="form-select">

                        <option value="">
                            All Priority
                        </option>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>


                <!-- CLEAR -->

                <div class="col-md-12 col-lg-2
                            d-flex align-items-end">

                    <button
                        class="btn btn-outline-secondary w-100"
                        onclick="clearFilters()">

                        <i class="bi bi-x-circle"></i>
                        Clear Filters

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =============================== -->
    <!-- TASK TABLE -->
    <!-- =============================== -->

    <div class="card shadow-sm">

        <div class="card-header bg-white
                    d-flex justify-content-between
                    align-items-center">

            <h5 class="mb-0 fw-bold">
                <i class="bi bi-list-check"></i>
                My Tasks
            </h5>

            <span
                id="taskCount"
                class="badge bg-primary">
                0 Tasks
            </span>

        </div>


        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover
                              align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th>
                                Task
                            </th>

                            <th>
                                Project
                            </th>

                            <th>
                                Priority
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Due Date
                            </th>

                            <th class="text-center">
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tasksTableBody">

                        <tr>

                            <td colspan="6"
                                class="text-center
                                       text-muted py-5">

                                <div class="spinner-border
                                            text-primary"
                                     role="status">

                                </div>

                                <div class="mt-2">
                                    Loading tasks...
                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- =============================== -->
<!-- ADD / EDIT TASK MODAL -->
<!-- =============================== -->

<div class="modal fade"
     id="taskModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <!-- MODAL HEADER -->

            <div class="modal-header">

                <h5 class="modal-title"
                    id="taskModalTitle">

                    <i class="bi bi-plus-circle"></i>
                    Add Task

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <!-- FORM -->

            <form id="taskForm">

                <div class="modal-body">

                    <input
                        type="hidden"
                        id="taskId">


                    <!-- TITLE -->

                    <div class="mb-3">

                        <label
                            for="taskTitle"
                            class="form-label fw-semibold">

                            Task Title
                            <span class="text-danger">*</span>

                        </label>

                        <input
                            type="text"
                            id="taskTitle"
                            class="form-control"
                            placeholder="Enter task title"
                            required>

                    </div>


                    <!-- PROJECT -->

                    <div class="mb-3">

                        <label
                            for="taskProject"
                            class="form-label fw-semibold">

                            Project
                            <span class="text-danger">*</span>

                        </label>

                        <select
                            id="taskProject"
                            class="form-select"
                            required>

                            <option value="">
                                Select Project
                            </option>

                        </select>

                    </div>


                    <div class="row">

                        <!-- STATUS -->

                        <div class="col-md-6 mb-3">

                            <label
                                for="taskStatus"
                                class="form-label fw-semibold">

                                Status

                            </label>

                            <select
                                id="taskStatus"
                                class="form-select">

                                <option value="Todo">
                                    To Do
                                </option>

                                <option value="In Progress">
                                    In Progress
                                </option>

                                <option value="Completed">
                                    Completed
                                </option>

                            </select>

                        </div>


                        <!-- PRIORITY -->

                        <div class="col-md-6 mb-3">

                            <label
                                for="taskPriority"
                                class="form-label fw-semibold">

                                Priority

                            </label>

                            <select
                                id="taskPriority"
                                class="form-select">

                                <option value="Low">
                                    Low
                                </option>

                                <option value="Medium"
                                        selected>

                                    Medium

                                </option>

                                <option value="High">
                                    High
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- DUE DATE -->

                    <div class="mb-3">

                        <label
                            for="taskDueDate"
                            class="form-label fw-semibold">

                            Due Date

                        </label>

                        <input
                            type="date"
                            id="taskDueDate"
                            class="form-control">

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="mb-3">

                        <label
                            for="taskDescription"
                            class="form-label fw-semibold">

                            Description

                        </label>

                        <textarea
                            id="taskDescription"
                            class="form-control"
                            rows="4"
                            placeholder="Enter task description">
                        </textarea>

                    </div>

                </div>


                <!-- MODAL FOOTER -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="saveTaskButton">

                        <i class="bi bi-save"></i>
                        Save Task

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Task JavaScript -->

<script src="tasks.js"></script>


</body>

</html>
