<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Project Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h2>Project Tracker</h2>

        <h5 class="text-center mb-4">
            Login
        </h5>

        <form id="loginForm">

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginButton"
                class="btn btn-primary w-100"
            >
                Login
            </button>

        </form>

        <div id="message" class="mt-3"></div>

        <p class="text-center mt-3 mb-0">
            Don't have an account?
            <a href="register.html">
                Register
            </a>
        </p>

    </div>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const loginForm =
                    document.getElementById("loginForm");

                const loginButton =
                    document.getElementById("loginButton");

                const message =
                    document.getElementById("message");


                loginForm.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();

                        loginButton.disabled = true;
                        loginButton.textContent =
                            "Logging in...";


                        const email =
                            document
                                .getElementById("email")
                                .value
                                .trim()
                                .toLowerCase();


                        const password =
                            document
                                .getElementById("password")
                                .value;


                        message.innerHTML = "";


                        try {

                            const response =
                                await fetch(
                                    "http://localhost:5000/api/auth/login",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body: JSON.stringify({
                                            email: email,
                                            password: password
                                        })
                                    }
                                );


                            const result =
                                await response.json();


                            if (!response.ok) {

                                throw new Error(
                                    result.message ||
                                    "Invalid email or password"
                                );

                            }


                            if (!result.token) {

                                throw new Error(
                                    "Server did not return login token."
                                );

                            }


                            // Save JWT
                            localStorage.setItem(
                                "token",
                                result.token
                            );


                            // Save user
                            if (result.user) {

                                localStorage.setItem(
                                    "user",
                                    JSON.stringify(result.user)
                                );

                            }


                            console.log(
                                "Login successful"
                            );

                            console.log(
                                "Token saved:",
                                !!localStorage.getItem("token")
                            );


                            message.innerHTML = `
                                <div class="alert alert-success">
                                    <strong>
                                        Login successful!
                                    </strong>
                                    <br>
                                    Opening Project Tracker...
                                </div>
                            `;


                            loginButton.textContent =
                                "Login Successful";


                            setTimeout(
                                function () {

                                    window.location.href =
                                        "index.html";

                                },
                                700
                            );


                        } catch (error) {

                            console.error(
                                "Login error:",
                                error
                            );


                            message.innerHTML = `
                                <div class="alert alert-danger">
                                    ${error.message}
                                </div>
                            `;


                            loginButton.disabled = false;

                            loginButton.textContent =
                                "Login";

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
